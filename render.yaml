services:
  - type: web
    name: inventory-api
    runtime: docker
    repo: https://github.com/yourusername/daily-inventory-system
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 5000
      - key: DB_HOST
        fromDatabase:
          name: inventory-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: inventory-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: inventory-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: inventory-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: inventory-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health

  - type: web
    name: inventory-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://inventory-api.onrender.com/api
    routes:
      - type: rewrite
        source: /.*
        destination: /index.html

databases:
  - name: inventory-db
    databaseName: inventory_db
    user: inventory_user
    plan: free
